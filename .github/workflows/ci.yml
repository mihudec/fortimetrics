name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make check
      - run: go build -trimpath -o bin/fortimetrics ./cmd/fortimetrics
      - run: bin/fortimetrics --version
      - run: FORTIADC_PASSWORD=test bin/fortimetrics -check-config -config fortimetrics.example.yml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          cache-from: type=gha,scope=ci
          cache-to: type=gha,scope=ci,mode=max
          tags: fortimetrics:ci
      - run: docker run --rm fortimetrics:ci --version
